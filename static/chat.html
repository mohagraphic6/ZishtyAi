<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Zishty"/>
<meta name="theme-color" content="#7c3aed"/>
<link rel="manifest" href="/static/manifest.json"/>
<link rel="apple-touch-icon" href="/static/images.jpg"/>
<title>Zishty</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#06060f;color:#eee;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

/* Futuristic grid overlay */
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;background-image:linear-gradient(#7c3aed 1px,transparent 1px),linear-gradient(90deg,#7c3aed 1px,transparent 1px);background-size:40px 40px}

/* Glow orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:orbFloat 8s ease-in-out infinite}
.orb1{width:400px;height:400px;background:rgba(124,58,237,.12);top:-100px;left:-100px;animation-delay:0s}
.orb2{width:300px;height:300px;background:rgba(79,70,229,.1);bottom:-80px;right:-80px;animation-delay:3s}
.orb3{width:200px;height:200px;background:rgba(167,139,250,.08);top:40%;left:50%;animation-delay:5s}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}

.app{display:flex;flex-direction:column;height:100vh;height:calc(var(--vh,1vh)*100);position:relative;z-index:1;max-width:780px;margin:0 auto;width:100%}

/* Header */
header{padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(124,58,237,.2);flex-shrink:0;background:rgba(6,6,15,.7);backdrop-filter:blur(20px);position:relative}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#7c3aed,transparent)}
.logo-img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #7c3aed;box-shadow:0 0 12px rgba(124,58,237,.5)}
.logo-text{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:0.68rem;color:#444;margin-left:2px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;transition:background .3s,box-shadow .3s}
.status-txt{font-size:0.7rem;color:#aaa;transition:color .3s}@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px #4ade80}50%{opacity:.5;box-shadow:0 0 16px #4ade80}}
.status-txt{font-size:0.7rem;color:#4ade80}
.tts-btn{background:none;border:1px solid rgba(124,58,237,.3);color:#555;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tts-btn.on{color:#a78bfa;border-color:#7c3aed;box-shadow:0 0 8px rgba(124,58,237,.3)}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;min-height:0;overscroll-behavior:contain}
.msg-wrap{display:flex;flex-direction:column;gap:5px;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-wrap.user{align-items:flex-end}
.msg-wrap.bot{align-items:flex-start}
.msg-row{display:flex;gap:10px;align-items:flex-start}
.msg-row.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;flex-shrink:0;border:1px solid rgba(124,58,237,.3)}
.avatar.bot{background:linear-gradient(135deg,#7c3aed,#4f46e5);box-shadow:0 0 10px rgba(124,58,237,.4)}
.avatar.user{background:#1a1a2e}
.msg{padding:11px 15px;border-radius:18px;font-size:0.87rem;line-height:1.65;max-width:82%;word-break:break-word;position:relative}
.msg.user{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border-bottom-right-radius:4px;box-shadow:0 4px 20px rgba(124,58,237,.3)}
.msg.bot{background:rgba(20,20,40,.9);border:1px solid rgba(124,58,237,.2);border-bottom-left-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.msg.bot::before{content:'';position:absolute;inset:0;border-radius:18px;border-bottom-left-radius:4px;background:linear-gradient(135deg,rgba(124,58,237,.05),transparent);pointer-events:none}
.msg.bot pre{background:#050510;border:1px solid rgba(124,58,237,.2);border-radius:6px;padding:10px;overflow-x:auto;font-size:0.78rem;margin-top:8px}
.msg.bot code{background:rgba(124,58,237,.15);padding:1px 5px;border-radius:4px;font-size:0.8rem;color:#c4b5fd}
.msg-acts{display:flex;gap:5px;padding:0 6px}
.msg-acts button{background:none;border:none;color:#333;cursor:pointer;font-size:0.68rem;padding:2px 7px;border-radius:4px;transition:all .15s}
.msg-acts button:hover{color:#a78bfa;background:rgba(124,58,237,.1)}

/* Typing indicator */
.typing{display:flex;gap:5px;align-items:center;padding:12px 15px}
.typing span{width:7px;height:7px;border-radius:50%;background:#7c3aed;animation:typingDot 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}

/* Input */
.input-area{padding:14px 20px 18px;flex-shrink:0;background:rgba(6,6,15,.7);backdrop-filter:blur(20px);position:relative}
.input-area::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(124,58,237,.4),transparent)}
.input-box{background:rgba(15,15,30,.9);border:1px solid rgba(124,58,237,.25);border-radius:20px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;transition:all .2s;box-shadow:0 0 0 0 rgba(124,58,237,0)}
.input-box:focus-within{border-color:rgba(124,58,237,.6);box-shadow:0 0 20px rgba(124,58,237,.15)}
.input-row{display:flex;gap:8px;align-items:flex-end;width:100%}
textarea.inp{flex:1;min-width:0;background:transparent;border:none;color:#eee;font-size:0.88rem;resize:none;outline:none;min-height:24px;max-height:120px;font-family:inherit;line-height:1.5;align-self:center}
textarea.inp::placeholder{color:#333}
.mic-btn{background:none;border:1px solid rgba(124,58,237,.25);color:#555;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:.9rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mic-btn:hover{color:#a78bfa;border-color:#7c3aed}
.mic-btn.rec{color:#ef4444;border-color:#ef4444;box-shadow:0 0 12px rgba(239,68,68,.3);animation:recPulse 1s ease-in-out infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 8px rgba(239,68,68,.3)}50%{box-shadow:0 0 20px rgba(239,68,68,.6)}}
.send-btn{background:linear-gradient(135deg,#7c3aed,#4f46e5);border:none;color:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:1rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 4px 15px rgba(124,58,237,.4)}
.send-btn:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(124,58,237,.6)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}

/* Shared */
.btn{background:linear-gradient(135deg,#7c3aed,#4f46e5);border:none;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:0.82rem;transition:all .2s;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn.s{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.4);color:#a78bfa;box-shadow:none}
.inp-f{background:rgba(10,10,25,.8);border:1px solid rgba(124,58,237,.2);color:#eee;padding:8px 11px;border-radius:8px;font-size:0.82rem;outline:none;font-family:inherit;width:100%;transition:border-color .15s}
.inp-f:focus{border-color:#7c3aed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.result-box{background:#050510;border:1px solid rgba(124,58,237,.2);color:#4ade80;padding:8px;border-radius:7px;font-family:'Courier New',monospace;font-size:0.8rem;margin-top:8px;word-break:break-all;white-space:pre-wrap;min-height:32px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(124,58,237,.2);border-top-color:#a78bfa;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:8px 20px;border-radius:20px;font-size:0.8rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(124,58,237,.4)}
.toast.show{opacity:1}
img.preview{max-width:100%;border-radius:10px;margin-top:8px;display:block;box-shadow:0 4px 20px rgba(0,0,0,.4)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(124,58,237,.3);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#7c3aed}
.sec-card{background:rgba(15,15,35,.8);border:1px solid rgba(124,58,237,.2);border-radius:10px;padding:12px;margin-bottom:10px}
.sec-card h4{font-size:0.75rem;color:#a78bfa;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.str-wrap{height:5px;background:#1e1e3a;border-radius:3px;margin-top:5px}
.str-fill{height:5px;border-radius:3px;transition:width .3s,background .3s;width:0%}
canvas.sketch{border:1px solid rgba(124,58,237,.2);border-radius:7px;cursor:crosshair;background:#050510;display:block;width:100%;touch-action:none}

/* Scan animation */
.scan-wrap{position:relative;display:inline-block;width:100%;border-radius:10px;overflow:hidden;border:1px solid rgba(124,58,237,.4)}
.scan-wrap img{width:100%;display:block;border-radius:10px}
.scan-line{position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,#a78bfa,#7c3aed,#a78bfa,transparent);box-shadow:0 0 12px #7c3aed,0 0 24px #a78bfa;animation:scanMove 1.6s linear infinite;top:0}
.scan-corners::before,.scan-corners::after{content:'';position:absolute;width:18px;height:18px;border-color:#a78bfa;border-style:solid;border-width:0}
.scan-corners::before{top:6px;left:6px;border-top-width:2px;border-left-width:2px}
.scan-corners::after{bottom:6px;right:6px;border-bottom-width:2px;border-right-width:2px}
.scan-overlay{position:absolute;inset:0;background:rgba(124,58,237,.06);animation:scanPulse 1.6s ease-in-out infinite}
@keyframes scanMove{0%{top:0%}100%{top:100%}}
@keyframes scanPulse{0%,100%{opacity:.3}50%{opacity:.7}}
.feat-bar{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 6px;border-bottom:1px solid #1e1e3a;margin-bottom:6px}
.feat-btn{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);color:#a78bfa;padding:4px 10px;border-radius:20px;cursor:pointer;font-size:0.82rem;transition:all .15s}
.feat-btn:hover{background:rgba(124,58,237,.35);border-color:#7c3aed}
/* themes */
body.theme-light{background:#f0f0f8;color:#111}
body.theme-light .msg.bot{background:#fff;border-color:#ddd;color:#111}
body.theme-light .input-box{background:#fff;border-color:#ddd}
body.theme-light .inp{color:#111}
body.theme-green{background:#001a00;color:#00ff41}
body.theme-green .msg.bot{background:#002200;border-color:#00ff41;color:#00ff41}
body.theme-green .msg.user{background:linear-gradient(135deg,#006600,#004400)}
/* pinned */
.pinned-bar{background:rgba(124,58,237,.1);border-bottom:1px solid rgba(124,58,237,.3);padding:6px 12px;font-size:0.75rem;color:#a78bfa;display:none}
.pinned-bar.show{display:block}
/* draw canvas */
.draw-canvas{border:1px solid #2d2d4e;border-radius:8px;cursor:crosshair;background:#050510;touch-action:none;display:block;max-width:100%}

/* Mobile — full phone optimisation */
@media(max-width:600px){
  body{font-size:15px}
  .app{max-width:100%;height:100dvh}
  header{padding:8px 12px;gap:8px}
  .logo-img{width:30px;height:30px}
  .logo-text{font-size:0.9rem}
  .logo-sub{display:none}
  .status-txt{font-size:0.68rem}
  .tts-btn{width:28px;height:28px;font-size:0.8rem}
  .messages{padding:10px 8px;gap:10px}
  .msg-row{gap:6px}
  .avatar{width:24px;height:24px;font-size:0.7rem;flex-shrink:0}
  .msg{font-size:0.85rem;padding:9px 12px;max-width:88%;border-radius:14px}
  .msg-acts button{font-size:0.68rem;padding:1px 5px}
  .input-area{padding:6px 8px 10px}
  .input-box{border-radius:14px;padding:7px 10px;gap:6px}
  .input-row{gap:5px}
  textarea.inp{font-size:16px;min-height:22px}
  .mic-btn{width:32px;height:32px;font-size:0.85rem}
  .send-btn{width:32px;height:32px;font-size:0.9rem}
  .feat-bar{gap:5px;padding:4px 0 6px}
  .feat-btn{padding:4px 9px;font-size:0.78rem}
  .modal{padding:14px;border-radius:14px;max-height:88vh;margin:8px}
  .modal h3{font-size:0.85rem}
  .pinned-bar{font-size:0.72rem;padding:5px 10px}
  .sec-card{padding:10px}
  .sec-card h4{font-size:0.72rem}
}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:#0d0d1e;border:1px solid rgba(124,58,237,.3);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{color:#a78bfa;font-size:0.9rem;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.modal-close{float:right;background:none;border:none;color:#555;cursor:pointer;font-size:1rem;transition:color .15s}
.modal-close:hover{color:#ef4444}
</style>

</head>
<body>
<canvas id="bg"></canvas>
<div id="grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="app">
  <header>
    <img class="logo-img" src="/static/images.jpg" alt="Zishty"/>
    <div>
      <span class="logo-text">Zishty</span>
      <span class="logo-sub">by Mr Moha</span>
    </div>
    <div class="header-right">
      <div class="status-dot" id="focusDot"></div>
      <span class="status-txt" id="focusTxt" onclick="runFeature('pomodoro')" style="cursor:pointer" title="Click to start/stop focus timer">Ready</span>
      <button class="tts-btn" id="ttsBtn" onclick="toggleTTS()" title="Voice output">🔊</button>
    </div>
  </header>

  <div class="pinned-bar" id="pinnedBar">📌 <span id="pinnedText"></span></div>
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="input-box">
      <div class="feat-bar" id="featBar" style="display:none">
        <button class="feat-btn" onclick="runFeature('translate')" title="Translate">🌍</button>
        <button class="feat-btn" onclick="runFeature('summarize')" title="Summarize">📄</button>
        <button class="feat-btn" onclick="runFeature('code')" title="Explain Code">💻</button>
        <button class="feat-btn" onclick="runFeature('story')" title="Write Story">✍️</button>
        <button class="feat-btn" onclick="runFeature('calc')" title="Calculator">🧮</button>
        <button class="feat-btn" onclick="runFeature('convert')" title="Convert">🔄</button>
        <button class="feat-btn" onclick="runFeature('qr')" title="QR Code">⬛</button>
        <button class="feat-btn" onclick="runFeature('roast')" title="Roast Me">🔥</button>
        <button class="feat-btn" onclick="runFeature('quote')" title="Quote">💬</button>
        <button class="feat-btn" onclick="runFeature('draw')" title="Draw & Guess">🎨</button>
        <button class="feat-btn" onclick="runFeature('theme')" title="Theme">�</button>
        <button class="feat-btn" onclick="runFeature('pin')" title="Pin Message">📌</button>
        <button class="feat-btn" onclick="runFeature('music')" title="Music Mood">🎵</button>
        <button class="feat-btn" onclick="runFeature('password')" title="Password">🔑</button>
      </div>
      <div class="input-row">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Voice input">🎤</button>
        <button class="mic-btn" onclick="toggleFeatBar()" title="Features">＋</button>
        <textarea class="inp" id="chatInp" placeholder="Message Zishty…" rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
        <button class="mic-btn" onclick="document.getElementById('solveFile').click()" title="Upload file">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
          </svg>
        </button>
        <button class="mic-btn" onclick="solveFromCamera()" title="Camera">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
        <button class="send-btn" id="sendBtn" onclick="sendChat()">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- Modals (opened by chat intent) -->
<!-- hidden solve inputs -->
<input type="file" id="solveFile" accept="*/*" style="display:none" onchange="uploadAndChat()"/>
<video id="solveVideo" autoplay playsinline style="display:none"></video>
<canvas id="solveCanvas" style="display:none"></canvas>

<div class="modal-bg" id="modal-image" onclick="if(event.target===this)closeModal('image')">
  <div class="modal"><button class="modal-close" onclick="closeModal('image')">✕</button><h3>🖼 Image Tools</h3>
    <div class="sec-card"><h4>Generate Image</h4><input class="inp-f" id="imgPrompt" placeholder="Describe the image…"/><div class="row"><button class="btn" onclick="genImage()">Generate</button></div><div id="imgOut" style="margin-top:8px"></div></div>
    <div class="sec-card"><h4>Image to Text</h4><input type="file" id="i2tFile" accept="image/*" style="color:#aaa;font-size:0.78rem"/><div class="row"><button class="btn" onclick="imgToText()">Describe</button></div><div class="result-box" id="i2tOut"></div></div>
    <div class="sec-card"><h4>✏️ Sketch to Image</h4><input class="inp-f" id="sketchPrompt" placeholder="Describe refinement…" style="margin-bottom:8px"/><canvas id="sketchCanvas" class="sketch" width="440" height="200"></canvas><div class="row"><button class="btn s" onclick="clearSketch()">Clear</button><button class="btn" onclick="sketchToImg()">Generate</button></div><div id="sketchOut" style="margin-top:8px"></div></div>
  </div>
</div>
<div class="modal-bg" id="modal-video" onclick="if(event.target===this)closeModal('video')">
  <div class="modal"><button class="modal-close" onclick="closeModal('video')">✕</button><h3>🎬 Video Generator</h3>
    <p style="font-size:0.75rem;color:#555;margin-bottom:10px">Short 2-4 sec clips. Takes 1-3 minutes.</p>
    <input class="inp-f" id="videoPrompt" placeholder="Describe the video…"/><div class="row"><button class="btn" onclick="genVideo()">Generate</button></div><div id="videoOut" style="margin-top:10px"></div>
  </div>
</div>
<div class="modal-bg" id="modal-code" onclick="if(event.target===this)closeModal('code')">
  <div class="modal"><button class="modal-close" onclick="closeModal('code')">✕</button><h3>▶ Code Runner</h3>
    <div class="row" style="margin-bottom:8px"><select class="inp-f" id="codeLang" style="width:120px"><option value="python">Python</option><option value="javascript">JavaScript</option></select><button class="btn" onclick="runCode()">Run</button><button class="btn s" onclick="document.getElementById('codeEditor').value='';document.getElementById('codeOut').textContent=''">Clear</button></div>
    <textarea id="codeEditor" style="width:100%;height:180px;background:#050510;border:1px solid rgba(124,58,237,.2);color:#c4b5fd;padding:8px;border-radius:7px;font-family:'Courier New',monospace;font-size:0.82rem;resize:vertical;outline:none" placeholder="# Write code here…" spellcheck="false"></textarea>
    <div style="font-size:0.7rem;color:#555;margin-top:8px">Output:</div>
    <div id="codeOut" style="background:#020208;border:1px solid rgba(124,58,237,.15);color:#4ade80;padding:8px;border-radius:7px;font-family:'Courier New',monospace;font-size:0.78rem;min-height:60px;white-space:pre-wrap;margin-top:4px"></div>

// ── BG canvas ──
(function(){const c=document.getElementById('bg'),ctx=c.getContext('2d');let W,H,pts=[];function resize(){W=c.width=innerWidth;H=c.height=innerHeight;pts=Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()*1.4+.4,hue:Math.random()>0.7?260:220}))}addEventListener('resize',resize);resize();(function draw(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},70%,65%,.35)`;ctx.fill()});pts.forEach((a,i)=>pts.slice(i+1).forEach(b=>{const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(124,58,237,${.12*(1-d/120)})`;ctx.lineWidth=.6;ctx.stroke()}}));requestAnimationFrame(draw)})();})();

// ── State ──
let ttsOn=false,isRec=false,mediaRec=null,audioChunks=[];

// ── Helpers ──
function toast(m,d=2200){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){return t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${esc(c.trim())}</code></pre>`).replace(/`([^`]+)`/g,(_,c)=>`<code>${esc(c)}</code>`).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>')}

function appendMsg(role,html,raw){
  const wrap=document.createElement('div');wrap.className='msg-wrap '+role;
  const row=document.createElement('div');row.className=role==='user'?'msg-row user':'msg-row';
  const av=document.createElement('div');av.className='avatar '+role;
  if(role==='bot'){
    const img=document.createElement('img');
    img.src='/static/images.jpg';
    img.style.cssText='width:100%;height:100%;border-radius:50%;object-fit:cover';
    av.appendChild(img);
  } else {
    av.textContent='👤';
  }
  const msg=document.createElement('div');msg.className='msg '+role;msg.innerHTML=md(html);
  row.appendChild(av);row.appendChild(msg);
  wrap.appendChild(row);
  if(role==='bot'){
    const acts=document.createElement('div');acts.className='msg-acts';
    const cp=document.createElement('button');cp.textContent='📋 Copy';
    cp.onclick=()=>{navigator.clipboard.writeText(raw||msg.innerText);toast('Copied!')};
    const sp=document.createElement('button');sp.textContent='⏹ Stop';
    sp.onclick=()=>speechSynthesis.cancel();
    acts.appendChild(cp);acts.appendChild(sp);
    wrap.appendChild(acts);
  }
  document.getElementById('messages').appendChild(wrap);
  const _m=document.getElementById('messages');_m.scrollTo({top:_m.scrollHeight,behavior:'smooth'});
  chatHistory.push({role:role==='user'?'user':'assistant',text:raw||html});
  return msg;
}

async function sendChat(){
  const inp=document.getElementById('chatInp');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';inp.style.height='auto';
  speechSynthesis.cancel();
  document.getElementById('sendBtn').disabled=true;
  appendMsg('user',esc(msg),msg);
  // typing indicator via appendMsg
  const typingMsg=appendMsg('bot','<div class="typing"><span></span><span></span><span></span></div>');

  let intent='chat';
  try{const c=await api('/classify',{message:msg});intent=c.intent||'chat'}catch(e){}

  typingMsg.closest('.msg-wrap').remove();

  if(intent==='image'){await chatImageIntent(msg);document.getElementById('sendBtn').disabled=false;return}
  if(intent==='websearch'){await chatWebIntent(msg);document.getElementById('sendBtn').disabled=false;return}

  try{
    const d=await api('/chat',{message:msg});
    const reply=d.reply||d.error||'…';
    appendMsg('bot',reply,reply);
    if(ttsOn)speak(reply);
    if(/save.*(note|notes)|add.*(note|notes)|generate.*note|create.*note/i.test(msg)){
      const r=await fetch('/notes');const nd=await r.json();
      const existing=nd.notes||[];existing.push(reply);
      await api('/notes',{notes:existing});notes=existing;
      appendMsg('bot','📝 Saved to Notes!');toast('Saved to Notes');
    }
  }catch(e){appendMsg('bot','⚠️ '+esc(e.message))}
  document.getElementById('sendBtn').disabled=false;
}

async function chatImageIntent(msg){
  const thinking=appendMsg('bot','<span class="spinner"></span> Generating your image…');
  const d=await api('/generate-image',{prompt:msg});
  thinking.closest('.msg-wrap').remove();
  if(d.url){
    const m=appendMsg('bot',`Here's your image! 🔥<br><img src="${d.url}" class="preview"/>`,msg);
    const btn=document.createElement('button');btn.className='btn s';btn.style.cssText='margin-top:6px;font-size:0.75rem';btn.textContent='⬇ Download';
    btn.onclick=()=>{const a=document.createElement('a');a.href=d.url;a.download='zishty.jpg';a.click()};
    m.appendChild(btn);
  }else appendMsg('bot','⚠️ '+(d.error||'Failed'));
}
async function chatWebIntent(msg){
  const d=await api('/websearch',{query:msg});
  if(d.summary)appendMsg('bot','🌐 '+d.summary,d.summary);
  else appendMsg('bot','⚠️ '+(d.error||'No results'));
}

// ── TTS ──
function toggleTTS(){ttsOn=!ttsOn;document.getElementById('ttsBtn').classList.toggle('on',ttsOn);toast(ttsOn?'Voice ON 🔊':'Voice OFF')}
function speak(t){
  if(!speechSynthesis)return;speechSynthesis.cancel();
  const clean=t.replace(/<[^>]+>/g,' ').replace(/```[\s\S]*?```/g,' ').replace(/[*_`#>\-]/g,' ').replace(/[\u{1F300}-\u{1FAFF}]|[\u{2600}-\u{27BF}]/gu,' ').replace(/\s+/g,' ').trim();
  const words=clean.split(' ');const chunks=[];
  for(let i=0;i<words.length;i+=200)chunks.push(words.slice(i,i+200).join(' '));
  let i=0;
  function next(){if(i>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[i++]);const voices=speechSynthesis.getVoices();const female=voices.find(v=>/female|zira|hazel|susan|karen|samantha|victoria|fiona|moira|tessa/i.test(v.name));if(female)u.voice=female;u.pitch=1.1;u.rate=1;u.onend=next;speechSynthesis.speak(u)}
  speechSynthesis.getVoices().length===0?speechSynthesis.onvoiceschanged=next:next();
}

// ── STT ──
async function toggleMic(){
  if(isRec){mediaRec&&mediaRec.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec=new MediaRecorder(stream);audioChunks=[];
    mediaRec.ondataavailable=e=>audioChunks.push(e.data);
    mediaRec.onstop=async()=>{
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      const fd=new FormData();fd.append('audio',blob,'audio.webm');
      try{const r=await fetch('/transcribe',{method:'POST',body:fd});const d=await r.json();if(d.text){document.getElementById('chatInp').value=d.text;document.getElementById('chatInp').style.height='auto';document.getElementById('chatInp').style.height=Math.min(document.getElementById('chatInp').scrollHeight,120)+'px';}}catch(e){}
      stream.getTracks().forEach(t=>t.stop());
      isRec=false;document.getElementById('micBtn').classList.remove('rec');document.getElementById('micBtn').textContent='🎤';
    };
    mediaRec.start();isRec=true;document.getElementById('micBtn').classList.add('rec');document.getElementById('micBtn').textContent='⏹';toast('Recording…');
  }catch(e){toast('Mic: '+e.message)}
}

async function genImage(){const prompt=document.getElementById('imgPrompt').value.trim();if(!prompt){toast('Enter prompt');return}const out=document.getElementById('imgOut');out.innerHTML='<span class="spinner"></span> Generating…';const d=await api('/generate-image',{prompt});if(d.url)out.innerHTML=`<img src="${d.url}" class="preview"/><button class="btn s" style="margin-top:6px;font-size:0.75rem" onclick="(function(){const a=document.createElement('a');a.href='${d.url}';a.download='zishty.jpg';a.click()})()">⬇ Download</button>`;else out.innerHTML='<span style="color:#f87171">'+esc(d.error||'Failed')+'</span>';}

(function(){const c=document.getElementById('sketchCanvas'),ctx=c.getContext('2d');ctx.strokeStyle='#a78bfa';ctx.lineWidth=2.5;ctx.lineCap='round';function pos(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)}}c.addEventListener('mousedown',e=>{skDrawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});c.addEventListener('mousemove',e=>{if(!skDrawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});c.addEventListener('mouseup',()=>skDrawing=false);c.addEventListener('mouseleave',()=>skDrawing=false);c.addEventListener('touchstart',e=>{e.preventDefault();skDrawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();if(!skDrawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()},{passive:false});c.addEventListener('touchend',()=>skDrawing=false);})();
function clearSketch(){const c=document.getElementById('sketchCanvas');c.getContext('2d').clearRect(0,0,c.width,c.height);document.getElementById('sketchOut').innerHTML=''}
async function sketchToImg(){const c=document.getElementById('sketchCanvas');const prompt=document.getElementById('sketchPrompt').value.trim()||'a refined detailed artwork';const out=document.getElementById('sketchOut');out.innerHTML='<span class="spinner"></span> Generating…';const d=await api('/sketch-to-image',{sketch:c.toDataURL('image/png'),prompt});if(d.url)out.innerHTML=`<img src="${d.url}" class="preview"/>${d.prompt?`<div style="font-size:0.7rem;color:#555;margin-top:4px;font-style:italic">"${esc(d.prompt)}"</div>`:''}<button class="btn s" style="margin-top:6px;font-size:0.75rem" onclick="(function(){const a=document.createElement('a');a.href='${d.url}';a.download='sketch.jpg';a.click()})()">⬇ Download</button>`;else out.innerHTML='<span style="color:#f87171">'+esc(d.error||'Failed')+'</span>';}

// ── Solve ──
let camStream=null;

async function uploadAndChat(){
  const file=document.getElementById('solveFile').files[0];
  if(!file)return;
  document.getElementById('solveFile').value='';
  const isImage=/\.(png|jpg|jpeg|gif|webp|bmp|svg)$/i.test(file.name)||file.type.startsWith('image/');
  const reader=new FileReader();
  if(isImage){
    reader.onload=async e=>{ await solveInChat(e.target.result) };
    reader.readAsDataURL(file);
  } else {
    // text, code, pdf-as-text, etc.
    reader.onload=async e=>{
      const content=e.target.result;
      // show in chat as user upload
      appendMsg('user','📎 '+esc(file.name),file.name);
      const thinking=appendMsg('bot','<span class="spinner"></span>');
      const prompt=`The user uploaded a file named "${file.name}". Here is its content:\n\n${content.substring(0,8000)}\n\nAnalyze it, summarize it, or answer any questions about it.`;
      const d=await api('/chat',{message:prompt});
      thinking.remove();
      const reply=d.reply||d.error||'…';
      appendMsg('bot',reply,reply);
      if(ttsOn)speak(reply);
    };
    reader.readAsText(file);
  }
}

async function solveFromCamera(){
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=document.getElementById('solveVideo');
    video.srcObject=camStream;
    // wait for video to be ready then snap
    video.onloadedmetadata=async()=>{
      video.play();
      await new Promise(r=>setTimeout(r,800));
      const canvas=document.getElementById('solveCanvas');
      canvas.width=video.videoWidth;canvas.height=video.videoHeight;
      canvas.getContext('2d').drawImage(video,0,0);
      const dataUrl=canvas.toDataURL('image/jpeg');
      camStream.getTracks().forEach(t=>t.stop());
      await solveInChat(dataUrl);
    };
  }catch(e){toast('Camera: '+e.message)}
}

async function solveInChat(dataUrl){
  // show image in chat with scan animation
  const wrap=document.createElement('div');wrap.className='msg-wrap bot';
  const row=document.createElement('div');row.className='msg-row';
  const av=document.createElement('div');av.className='avatar bot';av.textContent='⚡';
  const msg=document.createElement('div');msg.className='msg bot';
  msg.innerHTML=`
    <div class="scan-wrap scan-corners">
      <img src="${dataUrl}" style="width:100%;border-radius:8px;display:block"/>
      <div class="scan-overlay"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-status">🔍 Scanning question…</div>`;
  row.appendChild(av);row.appendChild(msg);wrap.appendChild(row);
  document.getElementById('messages').appendChild(wrap);
  const _m=document.getElementById('messages');_m.scrollTo({top:_m.scrollHeight,behavior:'smooth'});

  // extract question
  const r1=await fetch('/image-to-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl})});
  const d1=await r1.json();
  if(d1.error){msg.innerHTML='<span style="color:#f87171">'+esc(d1.error)+'</span>';return}
  const question=d1.description;
  msg.querySelector('.scan-status').textContent='🧠 Solving…';

  // solve
  const r2=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Solve this question or quiz and explain the answer step by step:\n\n'+question})});
  const d2=await r2.json();
  const answer=d2.reply||d2.error||'No answer';

  // replace with final result
  msg.innerHTML=`
    <img src="${dataUrl}" style="width:100%;border-radius:8px;margin-bottom:8px;border:1px solid rgba(124,58,237,.3)"/>
    <div style="font-size:0.72rem;color:#555;margin-bottom:4px">📋 Question</div>
    <div style="color:#aaa;font-size:0.8rem;margin-bottom:10px">${esc(question)}</div>
    <div style="font-size:0.72rem;color:#4ade80;margin-bottom:4px">✅ Answer</div>
    <div style="color:#eee;line-height:1.7">${md(answer)}</div>`;
  const _m=document.getElementById('messages');_m.scrollTo({top:_m.scrollHeight,behavior:'smooth'});
  chatHistory.push({role:'assistant',text:answer});
  if(ttsOn)speak(answer);
}

    case 'code':{
      const text=document.getElementById('chatInp').value.trim();
      if(!text){toast('Type your text in the input first ✏️');document.getElementById('chatInp').focus();return;}document.getElementById('chatInp').value='';
      appendMsg('user','💻 Explain code',text);
      const t=appendMsg('bot','<span class="spinner"></span>');
      const d=await api('/chat',{message:'Explain this code in simple plain English:\n\n```\n'+text+'\n```'});
      t.closest('.msg-wrap').remove();appendMsg('bot',d.reply||d.error,d.reply);break;
    }
    case 'story':{
      const topic=document.getElementById('chatInp').value.trim();
      if(!topic){toast('Type a topic in the input first ');document.getElementById('chatInp').focus();return;}document.getElementById('chatInp').value='';
      appendMsg('user','✍️ Write: '+esc(topic),topic);
      const t=appendMsg('bot','<span class="spinner"></span>');
      const d=await api('/chat',{message:'Write a creative short story or essay about: '+topic});
      t.closest('.msg-wrap').remove();appendMsg('bot',d.reply||d.error,d.reply);break;
    }
    case 'pomodoro':{
      if(pomRunning){
        clearInterval(pomTimer);pomRunning=false;
        document.getElementById('focusDot').style.background='#4ade80';
        document.getElementById('focusTxt').textContent='Ready';
        toast('Focus timer stopped');return;
      }
      pomSeconds=25*60;pomRunning=true;
      document.getElementById('focusDot').style.background='#f97316';
      pomTimer=setInterval(()=>{
        pomSeconds--;
        const m=String(Math.floor(pomSeconds/60)).padStart(2,'0');
        const s=String(pomSeconds%60).padStart(2,'0');
        document.getElementById('focusTxt').textContent=`Focus ${m}:${s}`;
        if(pomSeconds<=0){
          clearInterval(pomTimer);pomRunning=false;
          document.getElementById('focusDot').style.background='#4ade80';
          document.getElementById('focusTxt').textContent='Done!';
          appendMsg('bot','✅ Focus session done! Take a 5 min break 🎉');
          if(ttsOn)speak('Focus session done! Take a break.');
          setTimeout(()=>document.getElementById('focusTxt').textContent='Ready',5000);
        }
      },1000);
      toast('⏱ 25 min focus started');break;
    }
    case 'calc':{
      const expr=document.getElementById('chatInp').value.trim();
      if(!expr){toast('Type a calculation in the input first ');document.getElementById('chatInp').focus();return;}document.getElementById('chatInp').value='';
      appendMsg('user','🧮 '+esc(expr),expr);
      const t=appendMsg('bot','<span class="spinner"></span>');
      const d=await api('/chat',{message:'Calculate and solve this, show the steps: '+expr});
      t.closest('.msg-wrap').remove();appendMsg('bot',d.reply||d.error,d.reply);break;
    }
    case 'convert':{
      const val=document.getElementById('chatInp').value.trim();
      if(!val){toast('Type what to convert in the input first ');document.getElementById('chatInp').focus();return;}document.getElementById('chatInp').value='';
      appendMsg('user','🔄 Convert: '+esc(val),val);
      const t=appendMsg('bot','<span class="spinner"></span>');
      const d=await api('/chat',{message:'Convert this and show the result clearly: '+val});
      t.closest('.msg-wrap').remove();appendMsg('bot',d.reply||d.error,d.reply);break;
    }
    case 'qr':{
      const choice=confirm('Scan QR with camera?\nOK = Camera  |  Cancel = Generate QR');
      if(choice){
        // QR Scanner via camera
        const wrap=document.createElement('div');wrap.className='msg-wrap bot';
        const row=document.createElement('div');row.className='msg-row';
        const av=document.createElement('div');av.className='avatar bot';av.textContent='⚡';
        const msg=document.createElement('div');msg.className='msg bot';
        msg.innerHTML=`<div style="font-size:0.82rem;margin-bottom:6px">📷 Point camera at a QR code…</div>
          <video id="qrVideo" autoplay playsinline style="width:100%;border-radius:8px;border:1px solid #2d2d4e"></video>
          <canvas id="qrCanvas" style="display:none"></canvas>
          <div id="qrResult" style="margin-top:8px;color:#4ade80;font-size:0.85rem"></div>
          <button class="feat-btn" style="margin-top:6px" onclick="stopQrScan()">Stop</button>`;
        row.appendChild(av);row.appendChild(msg);wrap.appendChild(row);
        document.getElementById('messages').appendChild(wrap);
        const _m=document.getElementById('messages');_m.scrollTo({top:_m.scrollHeight,behavior:'smooth'});
        // load jsQR and start scan
        if(!window.jsQR){
          const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
          document.head.appendChild(s);
          await new Promise(r=>s.onload=r);
        }
        startQrScan();
      } else {
        // QR Generator
        const text=document.getElementById('chatInp').value.trim();
        if(!text){toast('Type your text in the input first ✏️');document.getElementById('chatInp').focus();return;}document.getElementById('chatInp').value='';
        appendMsg('user','⬛ QR: '+esc(text),text);
        const url=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}`;
        appendMsg('bot',`<img src="${url}" style="border-radius:8px;border:1px solid #2d2d4e;display:block;margin-top:4px"/><br><a href="${url}" download="qr.png" style="color:#a78bfa;font-size:0.78rem">⬇ Download</a>`);
      }
      break;
    }
    case 'roast':{
      const t=appendMsg('bot','<span class="spinner"></span>');
      const d=await api('/chat',{message:'Give me a funny friendly roast — be creative and humorous but not mean 😄'});
      t.closest('.msg-wrap').remove();appendMsg('bot',d.reply||d.error,d.reply);if(ttsOn)speak(d.reply);break;
    }
    case 'quote':{
      const t=appendMsg('bot','<span class="spinner"></span>');
      const d=await api('/chat',{message:'Give me one powerful motivational quote with the author name. Format: "quote" — Author'});
      t.closest('.msg-wrap').remove();appendMsg('bot','💬 '+d.reply,d.reply);if(ttsOn)speak(d.reply);break;
    }
    case 'draw':{
      const wrap=document.createElement('div');wrap.className='msg-wrap bot';
      const row=document.createElement('div');row.className='msg-row';
      const av=document.createElement('div');av.className='avatar bot';av.textContent='⚡';
      const msg=document.createElement('div');msg.className='msg bot';
      msg.innerHTML=`<div style="font-size:0.82rem;margin-bottom:6px">🎨 Draw something and I'll guess what it is!</div>
        <canvas id="drawCanvas" class="draw-canvas" width="300" height="180"></canvas>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="feat-btn" onclick="clearDraw()">Clear</button>
          <button class="feat-btn" onclick="guessDrawing()">🤔 Guess!</button>
        </div>
        <div id="drawGuess" style="margin-top:6px;color:#4ade80;font-size:0.85rem"></div>`;
      row.appendChild(av);row.appendChild(msg);wrap.appendChild(row);
      document.getElementById('messages').appendChild(wrap);
      const _m=document.getElementById('messages');_m.scrollTo({top:_m.scrollHeight,behavior:'smooth'});
      setTimeout(()=>{
        drawCanvas=document.getElementById('drawCanvas');
        drawCtx=drawCanvas.getContext('2d');
        drawCtx.strokeStyle='#a78bfa';drawCtx.lineWidth=3;drawCtx.lineCap='round';
        function pos(e){const r=drawCanvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(drawCanvas.width/r.width),y:(t.clientY-r.top)*(drawCanvas.height/r.height)}}
        drawCanvas.addEventListener('mousedown',e=>{drawDrawing=true;const p=pos(e);drawCtx.beginPath();drawCtx.moveTo(p.x,p.y)});
        drawCanvas.addEventListener('mousemove',e=>{if(!drawDrawing)return;const p=pos(e);drawCtx.lineTo(p.x,p.y);drawCtx.stroke()});
        drawCanvas.addEventListener('mouseup',()=>drawDrawing=false);
        drawCanvas.addEventListener('mouseleave',()=>drawDrawing=false);
      },100);break;
    }
    case 'theme':{
      themeIdx=(themeIdx+1)%themes.length;
      document.body.className='';
      if(themes[themeIdx]!=='default')document.body.classList.add('theme-'+themes[themeIdx]);
      toast('🎨 Theme: '+themes[themeIdx]);break;
    }
    case 'pin':{
      const msgs=document.querySelectorAll('.msg.bot');
      if(!msgs.length){toast('No message to pin');return}
      const pinned=msgs[msgs.length-1].innerText.substring(0,80)+'…';
      document.getElementById('pinnedText').textContent=pinned;
      document.getElementById('pinnedBar').classList.add('show');
      toast('📌 Pinned');break;
    }
    case 'music':{
      const mood=document.getElementById('chatInp').value.trim();
      if(!mood){toast('Type your mood in the input first ');document.getElementById('chatInp').focus();return;}document.getElementById('chatInp').value='';
      appendMsg('user','🎵 Music for: '+esc(mood),mood);
      const t=appendMsg('bot','<span class="spinner"></span>');
      const d=await api('/chat',{message:`Suggest 5 songs that match this mood: "${mood}". For each: song name, artist, and YouTube search link as https://www.youtube.com/results?search_query=song+artist`});
      t.closest('.msg-wrap').remove();appendMsg('bot',d.reply||d.error,d.reply);break;
    }
    case 'password':{
      const len=parseInt(document.getElementById('chatInp').value.trim())||16;document.getElementById('chatInp').value='';
      const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}';
      let pwd='';for(let i=0;i<len;i++)pwd+=chars[Math.floor(Math.random()*chars.length)];
      const msg=appendMsg('bot',`🔑 Password: <code>${esc(pwd)}</code>`);
      const btn=document.createElement('button');btn.className='feat-btn';btn.style.marginTop='6px';btn.textContent='📋 Copy';
      btn.onclick=()=>{navigator.clipboard.writeText(pwd);toast('Copied!')};
      msg.appendChild(btn);break;
    }
  }
}

// ── QR Scanner ──
let qrStream=null,qrAnimFrame=null;
async function startQrScan(){
  try{
    qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=document.getElementById('qrVideo');
    const canvas=document.getElementById('qrCanvas');
    const result=document.getElementById('qrResult');
    if(!video)return;
    video.srcObject=qrStream;
    video.play();
    const ctx=canvas.getContext('2d');
    function scan(){
      if(!document.getElementById('qrVideo')){stopQrScan();return}
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth;canvas.height=video.videoHeight;
        ctx.drawImage(video,0,0);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height);
        if(code){
          stopQrScan();
          const data=code.data;
          if(result)result.innerHTML=`✅ Scanned: <a href="${esc(data)}" target="_blank" style="color:#a78bfa">${esc(data)}</a>`;
          appendMsg('bot',`📷 QR Scanned:\n${esc(data)}`);
          navigator.clipboard.writeText(data).catch(()=>{});
          toast('QR copied to clipboard!');
          return;
        }
      }
      qrAnimFrame=requestAnimationFrame(scan);
    }
    qrAnimFrame=requestAnimationFrame(scan);
  }catch(e){toast('Camera: '+e.message)}
}
function stopQrScan(){
  if(qrStream)qrStream.getTracks().forEach(t=>t.stop());
  if(qrAnimFrame)cancelAnimationFrame(qrAnimFrame);
  qrStream=null;qrAnimFrame=null;
  const v=document.getElementById('qrVideo');if(v)v.srcObject=null;
}

function clearDraw(){if(drawCtx&&drawCanvas)drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height)}
async function guessDrawing(){
  if(!drawCanvas)return;
  const out=document.getElementById('drawGuess');
  out.innerHTML='<span class="spinner"></span> Guessing…';
  const d=await api('/image-to-text',{image:drawCanvas.toDataURL('image/png')});
  const g=await api('/chat',{message:'Based on this drawing description, guess what it is in one fun sentence: '+(d.description||'a drawing')});
  out.innerHTML='🤔 '+esc(g.reply||'Interesting drawing!');
}
